<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modelo de Riesgo Aviar</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: #050505;
    color: #ffffff;
    font-family: Arial, sans-serif;
}

body {
    width: 100%;
    min-height: 100vh;
    text-align: center;
}

.main-wrap {
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
    padding: 10px 14px 18px 14px;
}

h2 {
    font-size: 22px;
    color: #f0f0f0;
    margin: 6px 0 10px 0;
    font-weight: 700;
}

.tabs {
    margin: 6px 0 12px 0;
}

.tab {
    display: inline-block;
    padding: 7px 16px;
    background: #232323;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    margin: 0 5px;
    font-size: 13px;
    border: 1px solid #333;
}

.tab.active {
    background: #4a4a4a;
    border-color: #666;
}

.content {
    display: none;
}

.content.active {
    display: block;
}

.barra-superior {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
}

.botones-inline {
    display: flex;
    gap: 6px;
    background: #111;
    padding: 6px 8px;
    border-radius: 10px;
    border: 1px solid #262626;
}

.botones-inline button {
    padding: 5px 9px;
    font-size: 12px;
    border-radius: 6px;
    background: #2a2a2a;
    color: white;
    border: none;
    cursor: pointer;
    min-width: 36px;
}

.botones-inline button:hover {
    background: #444;
}

.estado-frame {
    font-size: 12px;
    color: #d0d0d0;
    background: #111;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid #262626;
}

.contenedor-mapa {
    width: 100%;
    display: flex;
    justify-content: center;
}

#mapa_img {
    width: 92%;
    max-width: 1200px;
    max-height: 72vh;
    object-fit: contain;
    border-radius: 10px;
    margin: 0 auto;
}

iframe {
    width: 92%;
    max-width: 1200px;
    height: 72vh;
    border: none;
    border-radius: 10px;
    margin: 0 auto;
    background: #0b0b0b;
}

.footer-note {
    margin-top: 8px;
    font-size: 11px;
    color: #9e9e9e;
}

@media (max-width: 900px) {
    #mapa_img,
    iframe {
        width: 100%;
        max-height: 70vh;
    }
}
</style>
</head>

<body>
<div class="main-wrap">

<h2>Modelo Probabilístico de Riesgo Aviar (72 h)</h2>

<div class="tabs">
    <div class="tab active" onclick="mostrar('mapa', this)">🗺️ Mapa</div>
    <div class="tab" onclick="mostrar('grafico', this)">📊 Evolución</div>
</div>

<div id="mapa" class="content active">

    <div class="barra-superior">
        <div class="botones-inline">
            <button onclick="prev()">⏮</button>
            <button onclick="play()">▶</button>
            <button onclick="pause()">⏸</button>
            <button onclick="next()">⏭</button>
        </div>

        <div class="estado-frame" id="estado_frame">Frame: f000</div>
    </div>

    <div class="contenedor-mapa">
        <img id="mapa_img" src="visor_riesgo_f000.png">
    </div>

</div>

<div id="grafico" class="content">
    <iframe src="riesgo_evolucion_72h.html"></iframe>
</div>

<div class="footer-note">
    Visualización automática del modelo probabilístico de riesgo aviar
</div>

</div>

<script>
function mostrar(id, el) {
    document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    el.classList.add('active');
}

let frames = [
"visor_riesgo_f000.png","visor_riesgo_f003.png","visor_riesgo_f006.png",
"visor_riesgo_f009.png","visor_riesgo_f012.png","visor_riesgo_f015.png",
"visor_riesgo_f018.png","visor_riesgo_f021.png","visor_riesgo_f024.png",
"visor_riesgo_f027.png","visor_riesgo_f030.png","visor_riesgo_f033.png",
"visor_riesgo_f036.png","visor_riesgo_f039.png","visor_riesgo_f042.png",
"visor_riesgo_f045.png","visor_riesgo_f048.png","visor_riesgo_f051.png",
"visor_riesgo_f054.png","visor_riesgo_f057.png","visor_riesgo_f060.png",
"visor_riesgo_f063.png","visor_riesgo_f066.png","visor_riesgo_f069.png",
"visor_riesgo_f072.png"
];

let etiquetas = [
"f000","f003","f006","f009","f012","f015","f018","f021","f024",
"f027","f030","f033","f036","f039","f042","f045","f048","f051",
"f054","f057","f060","f063","f066","f069","f072"
];

let i = 0;
let intervalo = null;

function mostrarFrame() {
    document.getElementById("mapa_img").src = frames[i];
    document.getElementById("estado_frame").textContent = "Frame: " + etiquetas[i];
}

function next() {
    i = (i + 1) % frames.length;
    mostrarFrame();
}

function prev() {
    i = (i - 1 + frames.length) % frames.length;
    mostrarFrame();
}

function play() {
    if (intervalo) return;
    intervalo = setInterval(next, 900);
}

function pause() {
    clearInterval(intervalo);
    intervalo = null;
}

mostrarFrame();
play();
</script>

</body>
</html>
